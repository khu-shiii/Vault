services:
  db:
    image: postgres:16
    container_name: vault-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vault_db
    ports:
      - "5432:5432"
    volumes:
      - vault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vault_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  anomaly:
    build: ./services/anomaly
    container_name: vault-anomaly
    ports:
      - "8000:8000"

  app:
    build: .
    container_name: vault-app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/vault_db
      ANOMALY_URL: http://anomaly:8000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      anomaly:
        condition: service_started

volumes:
  vault_pgdata: