services:
  db:
    image: postgres:16
    container_name: vault-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vault_db
    ports:
      - "5432:5432"
    volumes:
      - vault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vault_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vault_pgdata: